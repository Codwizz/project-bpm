name: Build Android APK

# Run it by hand: GitHub repo > Actions > "Build Android APK" > Run workflow.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Expo project and copy app code
        run: |
          npx create-expo-app@latest bpm-app --template blank --yes
          cp App.js messages.js notifications.js bpm-app/

      - name: Install packages and configure app
        working-directory: bpm-app
        run: |
          npx expo install expo-notifications @react-native-async-storage/async-storage
          cat > patch.js <<'EOF'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.name = 'BP Saathi';
          app.expo.slug = 'bp-saathi';
          app.expo.plugins = [...(app.expo.plugins || []), 'expo-notifications'];
          app.expo.android = {
            ...(app.expo.android || {}),
            package: 'com.bpsaathi.app',
            permissions: [
              'POST_NOTIFICATIONS',
              'SCHEDULE_EXACT_ALARM',
              'RECEIVE_BOOT_COMPLETED',
              'VIBRATE',
            ],
          };
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
          EOF
          node patch.js
          cat app.json

      - name: Generate Android project
        working-directory: bpm-app
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: bpm-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bp-saathi-apk
          path: bpm-app/android/app/build/outputs/apk/release/app-release.apk
